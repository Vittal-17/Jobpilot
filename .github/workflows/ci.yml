name: CI Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: jobpilot_test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: jobpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobpilot_test -d jobpilot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -r backend/requirements-dev.lock

      - name: Run Pytest
        env:
          API_SECRET_KEY: test-ci-secret-key-minimum-16
          TEST_DATABASE_URL: postgresql+psycopg://jobpilot_test:test_password@localhost:5432/jobpilot_test
          PYTHONPATH: backend
        run: pytest tests/ -q

name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lower case owner name
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi:${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_TIMESTAMP=${{ github.event.workflow_run.created_at }}

      - name: Verify Image Architecture and SHA
        run: |
          # Inspect the pulled image architecture
          ARCH=$(docker inspect ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi:${{ github.event.workflow_run.head_sha }} --format '{{.Architecture}}')
          if [ "$ARCH" != "arm64" ]; then
            echo "Error: Image architecture is $ARCH, expected arm64"
            exit 1
          fi

          # Inspect the APP_COMMIT_SHA variable inside the image
          SHA_ENV=$(docker inspect ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi:${{ github.event.workflow_run.head_sha }} --format '{{range .Config.Env}}{{println .}}{{end}}' | grep '^APP_COMMIT_SHA=' | cut -d= -f2)
          if [ "$SHA_ENV" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Error: APP_COMMIT_SHA environment variable is $SHA_ENV, expected ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi

          echo "Image verification passed."

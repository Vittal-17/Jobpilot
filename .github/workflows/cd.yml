name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    outputs:
      image_digest: ${{ steps.build_push.outputs.digest }}
    name: Build and Push ARM64 Image
    runs-on: ubuntu-24.04-arm
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set lower case owner name
        id: repo_owner
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to the Container registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.production
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi:${{ github.event.workflow_run.head_sha }}
          build-args: |
            APP_COMMIT_SHA=${{ github.event.workflow_run.head_sha }}
            BUILD_TIMESTAMP=${{ github.event.workflow_run.created_at }}

      - name: Verify Image Architecture and SHA
        run: |
          set -euo pipefail

          IMAGE_REF="ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi:${{ github.event.workflow_run.head_sha }}"

          echo "Pulling published image: $IMAGE_REF"
          docker pull "$IMAGE_REF"

          echo "Verifying architecture..."
          ARCH=$(docker inspect "$IMAGE_REF" --format '{{.Architecture}}')
          if [ "$ARCH" != "arm64" ]; then
            echo "Error: Image architecture is $ARCH, expected arm64"
            exit 1
          fi

          echo "Verifying exact commit SHA in environment..."
          SHA_ENV=$(docker inspect "$IMAGE_REF" --format '{{range .Config.Env}}{{println .}}{{end}}' | awk -F= '$1=="APP_COMMIT_SHA" {print $2}')
          if [ "$SHA_ENV" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "Error: APP_COMMIT_SHA environment variable is $SHA_ENV, expected ${{ github.event.workflow_run.head_sha }}"
            exit 1
          fi

          echo "Verifying published digest..."
          PUBLISHED_DIGEST="${{ steps.build_push.outputs.digest }}"
          if [ -z "$PUBLISHED_DIGEST" ]; then
            echo "Error: Published digest from build-push-action is empty."
            exit 1
          fi

          REPO_PREFIX="ghcr.io/${{ steps.repo_owner.outputs.owner }}/jobpilot-fastapi@"
          PULLED_DIGESTS=$(docker inspect "$IMAGE_REF" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="$REPO_PREFIX" 'index($0, prefix) == 1 {print substr($0, length(prefix) + 1)}')

          DIGEST_COUNT=$(echo "$PULLED_DIGESTS" | awk 'NF' | wc -l)
          if [ "$DIGEST_COUNT" -eq 0 ]; then
            echo "Error: No RepoDigest found for pulled image."
            exit 1
          elif [ "$DIGEST_COUNT" -gt 1 ]; then
            echo "Error: Found multiple RepoDigests matching prefix. Cannot safely verify."
            exit 1
          fi

          PULLED_DIGEST=$(echo "$PULLED_DIGESTS" | tr -d '[:space:]')

          if [ "$PULLED_DIGEST" != "$PUBLISHED_DIGEST" ]; then
            echo "Error: Pulled digest '$PULLED_DIGEST' does not match published digest '$PUBLISHED_DIGEST'"
            exit 1
          fi

          echo "Digest verification passed: $PULLED_DIGEST"
          echo "Image verification passed."

  deploy-to-production:
    name: Deploy to Production
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup exact release payload
        run: |
          set -euo pipefail

          SHA="${{ github.event.workflow_run.head_sha }}"
          DIGEST="${{ needs.build-and-publish.outputs.image_digest }}"

          mkdir -p archive_staging/scripts
          cp docker-compose.production.yml archive_staging/
          cp scripts/deploy.py archive_staging/scripts/
          cp Caddyfile archive_staging/
          echo "$SHA" > archive_staging/release_sha.txt
          echo "$DIGEST" > archive_staging/image_digest.txt

          cd archive_staging
          tar -cf ../release.tar docker-compose.production.yml scripts/ Caddyfile release_sha.txt image_digest.txt
          cd ..

          TAR_SHA256=$(sha256sum release.tar | awk '{print $1}')

          echo "$VPS_SSH_KEY" > deploy_key
          chmod 600 deploy_key

          echo "$VPS_KNOWN_HOSTS" > known_hosts

          cat release.tar | ssh -i deploy_key -o StrictHostKeyChecking=yes -o UserKnownHostsFile=known_hosts deploy@$VPS_HOST "$SHA $TAR_SHA256"
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}

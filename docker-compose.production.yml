name: jobpilot-prod

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  frontend:
    name: jobpilot_frontend
    driver: bridge
  backend:
    name: jobpilot_backend
    driver: bridge

volumes:
  postgres_data:
    name: jobpilot_postgres_data
  n8n_data:
    name: jobpilot_n8n_data
  caddy_data:
    name: jobpilot_caddy_data
  caddy_config:
    name: jobpilot_caddy_config

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN?DOMAIN must be set}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.38.1
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME?N8N_DB_NAME must be set}
      - DB_POSTGRESDB_USER=${N8N_DB_USER?N8N_DB_USER must be set}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD?N8N_DB_PASSWORD must be set}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY?N8N_ENCRYPTION_KEY must be set}
      - N8N_PORT=5678
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=https://${DOMAIN?DOMAIN must be set}/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_RUNNERS_TASK_TIMEOUT=30
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=104857600
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=1000
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - frontend
      - backend
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1G

  fastapi:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA must be set to an exact Git SHA}
    image: jobpilot-fastapi:${APP_COMMIT_SHA:?APP_COMMIT_SHA must be set to an exact Git SHA}
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB must be set}
      - API_SECRET_KEY=${API_SECRET_KEY?API_SECRET_KEY must be set}
      - ADZUNA_APP_ID=${ADZUNA_APP_ID:-}
      - ADZUNA_APP_KEY=${ADZUNA_APP_KEY:-}
      - ADZUNA_ENABLED=${ADZUNA_ENABLED:-true}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY:-}
      - JOOBLE_ENABLED=${JOOBLE_ENABLED:-true}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 1G

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G

  db-setup:
    image: postgres:16-alpine
    restart: "no"
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
      N8N_DB_NAME: ${N8N_DB_NAME?N8N_DB_NAME must be set}
      N8N_DB_USER: ${N8N_DB_USER?N8N_DB_USER must be set}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD?N8N_DB_PASSWORD must be set}
      POSTGRES_USER: ${POSTGRES_USER?POSTGRES_USER must be set}
      POSTGRES_DB: ${POSTGRES_DB?POSTGRES_DB must be set}
    command:
      - sh
      - -c
      - |
        cat << "SQL" > setup.sql
        SELECT format($$$$CREATE USER %I WITH PASSWORD %L$$$$, :'user_name', :'password_val')
        WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'user_name') \gexec

        ALTER USER :"user_name" WITH PASSWORD :'password_val';
        ALTER USER :"user_name" NOSUPERUSER NOCREATEDB NOCREATEROLE;

        SELECT format($$$$CREATE DATABASE %I OWNER %I$$$$, :'db_name', :'user_name')
        WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'db_name') \gexec

        REVOKE ALL PRIVILEGES ON DATABASE :"app_db" FROM :"user_name";
        REVOKE CONNECT ON DATABASE :"app_db" FROM PUBLIC;
        GRANT CONNECT ON DATABASE :"app_db" TO :"app_user";
        SQL
        psql -h db -U "$$POSTGRES_USER" -d postgres -v user_name="$$N8N_DB_USER" -v password_val="$$N8N_DB_PASSWORD" -v db_name="$$N8N_DB_NAME" -v app_db="$$POSTGRES_DB" -v app_user="$$POSTGRES_USER" -f setup.sql

  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
      args:
        APP_COMMIT_SHA: ${APP_COMMIT_SHA:?APP_COMMIT_SHA must be set to an exact Git SHA}
    image: jobpilot-fastapi:${APP_COMMIT_SHA:?APP_COMMIT_SHA must be set to an exact Git SHA}
    profiles:
      - tools
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=${POSTGRES_DB?POSTGRES_DB must be set}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy
      db-setup:
        condition: service_completed_successfully
    command: ["alembic", "upgrade", "head"]
